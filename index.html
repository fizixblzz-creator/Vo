<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Downloader</title>
<style>
:root{--bg:#0f1a2b;--panel:#17263d;--line:#2a3d5c;--ink:#e8eef7;--mute:#8fa3c0;--acc:#ffb547;--acc-ink:#1a1204;--bad:#ff7a7a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:20px}
main{width:100%;max-width:560px;padding-top:4vh}
h1{font-size:1.7rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 22px}
label{display:block;font-size:.85rem;color:var(--mute);margin:16px 0 6px}
input,select{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px}.row>*{flex:1}
button{padding:13px 16px;border-radius:10px;border:0;font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:var(--acc-ink)}
button.alt{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:wait}
#go{margin-top:14px;width:100%}
#card{display:none;margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#card img{width:100%;display:block;max-height:240px;object-fit:cover}
#card .body{padding:14px}
#title{font-weight:600;margin:0 0 2px}
#meta{color:var(--mute);font-size:.88rem;margin:0}
#msg{margin-top:16px;min-height:1.5em;color:var(--mute);font-size:.92rem}
#msg.err{color:var(--bad)}
details{margin-top:22px;color:var(--mute);font-size:.88rem}
</style>
</head>
<body>
<main>
  <h1>Video Downloader</h1>
  <p class="sub">Paste a link from YouTube, Instagram, TikTok, Facebook, X and more.</p>

  <label for="url">Video link</label>
  <input id="url" type="url" inputmode="url" placeholder="https://..." autocomplete="off">

  <div class="row">
    <div>
      <label for="type">Format</label>
      <select id="type"><option value="video">Video (MP4)</option><option value="audio">Audio (MP3)</option></select>
    </div>
    <div>
      <label for="quality">Quality</label>
      <select id="quality">
        <option value="360">360p</option><option value="480">480p</option>
        <option value="720" selected>720p</option><option value="1080">1080p</option>
      </select>
    </div>
  </div>

  <div class="row" style="margin-top:14px">
    <button id="check" class="alt">Preview</button>
    <button id="go">Download</button>
  </div>

  <div id="card">
    <img id="thumb" alt="">
    <div class="body"><p id="title"></p><p id="meta"></p></div>
  </div>
  <div id="msg" role="status"></div>

  <details>
    <summary>API key</summary>
    <label for="key">Saved in this browser only</label>
    <input id="key" type="password" placeholder="Paste your API key" autocomplete="off">
  </details>
</main>

<script>
const $ = id => document.getElementById(id);
const API = location.origin;
const msg = (t, err) => { $("msg").textContent = t; $("msg").className = err ? "err" : ""; };
try { $("key").value = localStorage.getItem("vdl_key") || ""; } catch (e) {}
if (!$("key").value) $("key").closest("details").open = true;

function headers() {
  const k = $("key").value.trim();
  try { localStorage.setItem("vdl_key", k); } catch (e) {}
  return { "x-api-key": k };
}
function checkInputs() {
  if (!$("key").value.trim()) { $("key").closest("details").open = true; msg("Enter your API key first.", true); return false; }
  if (!$("url").value.trim()) { msg("Paste a video link first.", true); return false; }
  return true;
}
async function errText(res) {
  try { return (await res.json()).detail || res.statusText; } catch (e) { return res.statusText || "Request failed"; }
}
function busy(b) { $("check").disabled = b; $("go").disabled = b; }
function fmt(s) { if (!s) return ""; const m = Math.floor(s / 60), r = s % 60; return m + ":" + String(r).padStart(2, "0"); }

$("check").onclick = async () => {
  if (!checkInputs()) return;
  busy(true); msg("Reading link. If the server was asleep, this can take up to a minute...");
  try {
    const res = await fetch(`${API}/api/info?url=${encodeURIComponent($("url").value.trim())}`, { headers: headers() });
    if (!res.ok) throw new Error(await errText(res));
    const d = await res.json();
    $("title").textContent = d.title || "Untitled";
    $("meta").textContent = [d.platform, d.uploader, fmt(d.duration)].filter(Boolean).join(" · ");
    if (d.thumbnail) { $("thumb").src = d.thumbnail; $("thumb").style.display = "block"; } else { $("thumb").style.display = "none"; }
    $("card").style.display = "block";
    msg("Ready. Press Download.");
  } catch (e) { $("card").style.display = "none"; msg(e.message, true); }
  busy(false);
};

$("go").onclick = async () => {
  if (!checkInputs()) return;
  busy(true); msg("Downloading and processing. Large videos can take a minute or two...");
  try {
    const type = $("type").value;
    const res = await fetch(`${API}/api/download?url=${encodeURIComponent($("url").value.trim())}&quality=${$("quality").value}&type=${type}`, { headers: headers() });
    if (!res.ok) throw new Error(await errText(res));
    const cd = res.headers.get("content-disposition") || "";
    const m = cd.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
    const name = m ? decodeURIComponent(m[1]) : (type === "audio" ? "audio.mp3" : "video.mp4");
    const blob = await res.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    msg("Downloaded: " + name);
  } catch (e) { msg(e.message, true); }
  busy(false);
};
</script>
</body>
</html>
