<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vidgrab - Video Downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E2347;--mute:#4D547F;--acc:#5B4BF5;--glass:rgba(255,255,255,.55);--edge:rgba(255,255,255,.85)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;position:relative;overflow-x:hidden;background:#E8EDFF;color:var(--ink);font-family:Nunito,system-ui,sans-serif;padding:20px 20px 56px}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.6;cursor:wait}
.blob{position:fixed;border-radius:50%;pointer-events:none;opacity:.9;z-index:0}
.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:10px;padding:8px 18px 8px 10px;border-radius:999px;font-weight:800;font-size:19px}
.logo i{width:34px;height:34px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center}
.pill-btn{height:40px;padding:0 18px;border-radius:999px;color:var(--ink);font-weight:700;cursor:pointer}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:8px}
h1{margin:0;font-weight:800;font-size:46px;line-height:1.1;letter-spacing:-.02em;max-width:640px}
.hero p{margin:0;color:var(--mute);font-size:18px;line-height:1.5;max-width:520px}
.search{width:100%;max-width:680px;margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;padding:8px;border-radius:28px;background:rgba(255,255,255,.6);box-shadow:0 10px 40px rgba(91,75,245,.12)}
.search input{flex:1 1 220px;min-width:0;height:52px;padding:0 18px;border-radius:20px;border:0;background:transparent;color:var(--ink);font-size:16px;font-weight:600}
.btn{border:0;background:var(--acc);color:#fff;font-weight:800;cursor:pointer}
.search .btn{flex:1 1 auto;height:52px;padding:0 28px;border-radius:20px;font-size:16px}
.keybox{display:none;width:100%;max-width:680px;padding:14px;border-radius:22px;text-align:left}
.keybox.open{display:block}
.keybox label{display:block;font-size:14px;font-weight:700;color:var(--mute);margin:0 0 8px}
.keybox input{width:100%;height:46px;padding:0 16px;border-radius:16px;border:1px solid var(--edge);background:rgba(255,255,255,.7);color:var(--ink);font-size:15px}
#msg{min-height:1.4em;margin:0;font-size:15px;font-weight:700;color:var(--mute)}
#msg.err{color:#C0305A}
#result{display:none;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:24px;padding:18px;border-radius:32px;background:rgba(255,255,255,.5);box-shadow:0 20px 60px rgba(60,70,140,.14)}
.thumb{position:relative;border-radius:22px;overflow:hidden;background:#C9D4FF;aspect-ratio:16/9;min-height:190px;display:flex;align-items:center;justify-content:center}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800}
.info{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{margin:0;font-weight:800;font-size:26px;line-height:1.2;overflow-wrap:anywhere}
.creator{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;border-radius:999px;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.9);align-self:flex-start;max-width:100%}
.avatar{width:46px;height:46px;flex:none;border-radius:50%;background:#FF9CC8;color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.cname{font-weight:800;font-size:16px;overflow-wrap:anywhere}
.csub{color:var(--mute);font-size:14px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px;border-radius:18px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9)}
.stat b{display:block;font-weight:800;font-size:18px}
.stat span{color:var(--mute);font-size:13px;font-weight:600}
.seg{display:inline-flex;align-self:flex-start;padding:4px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9)}
.seg button{height:38px;padding:0 20px;border-radius:999px;border:0;background:transparent;color:var(--ink);font-weight:700;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{height:40px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.6);color:var(--ink);font-weight:700;cursor:pointer}
.chips button.on{border-color:var(--acc);background:#fff;color:var(--acc);font-weight:800}
#dl{height:56px;border-radius:20px;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 28px rgba(91,75,245,.35)}
.plat{display:flex;flex-direction:column;align-items:center;gap:12px}
.plat h3{margin:0;font-size:15px;font-weight:700;color:var(--mute)}
.plat div{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.plat span{padding:8px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-size:14px;font-weight:700}
@media(max-width:560px){h1{font-size:32px}.hero p{font-size:16px}h2{font-size:22px}}
@media(prefers-reduced-motion:no-preference){button{transition:transform .12s}button:active:not(:disabled){transform:scale(.97)}}
</style>
</head>
<body>
<div class="blob" aria-hidden="true" style="left:-120px;top:-100px;width:420px;height:420px;background:#FFB3DA;filter:blur(80px)"></div>
<div class="blob" aria-hidden="true" style="right:-100px;top:120px;width:460px;height:460px;background:#8FD3FF;filter:blur(90px)"></div>
<div class="blob" aria-hidden="true" style="left:30%;bottom:-160px;width:440px;height:440px;background:#B6F0D2;filter:blur(90px)"></div>

<div class="wrap">
  <header>
    <div class="logo glass">
      <i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg></i>
      Vidgrab
    </div>
    <button type="button" id="keyBtn" class="pill-btn glass">API key</button>
  </header>

  <section class="hero">
    <h1>Paste a link, get your video</h1>
    <p>YouTube, Instagram, TikTok, Facebook and more. Quick, free and no sign-up.</p>
    <div class="keybox glass" id="keybox">
      <label for="key">Your API key (saved in this browser only)</label>
      <input id="key" type="password" placeholder="Paste API key" autocomplete="off">
    </div>
    <form class="search glass" id="form">
      <label for="link" style="position:absolute;left:-9999px">Video link</label>
      <input id="link" type="url" inputmode="url" placeholder="Paste video link here" autocomplete="off" required>
      <button class="btn" id="fetchBtn" type="submit">Fetch video</button>
    </form>
    <p id="msg" role="status"></p>
  </section>

  <section id="result" class="glass">
    <div class="thumb">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m10 8.5 5.5 3.5-5.5 3.5z" fill="#fff"/></svg>
      <img id="thumb" alt="Video thumbnail" referrerpolicy="no-referrer">
      <span class="tag" id="plat" style="left:12px;top:12px;background:rgba(255,255,255,.85)"></span>
      <span class="tag" id="dur" style="right:12px;bottom:12px;background:rgba(30,35,71,.85);color:#fff;font-weight:700"></span>
    </div>
    <div class="info">
      <h2 id="title"></h2>
      <div class="creator">
        <div class="avatar" id="avatar" aria-hidden="true"></div>
        <div style="min-width:0"><div class="cname" id="cname"></div><div class="csub" id="csub"></div></div>
      </div>
      <div class="stats">
        <div class="stat"><b id="views">-</b><span>views</span></div>
        <div class="stat"><b id="likes">-</b><span>likes</span></div>
        <div class="stat"><b id="ago">-</b><span id="agoL">uploaded</span></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="seg" role="group" aria-label="Format">
          <button type="button" id="tVideo" class="on">Video MP4</button>
          <button type="button" id="tAudio">Audio MP3</button>
        </div>
        <div class="chips" id="chips" role="group" aria-label="Quality"></div>
      </div>
      <button type="button" class="btn" id="dl"></button>
    </div>
  </section>

  <section class="plat">
    <h3>Works with</h3>
    <div><span>YouTube</span><span>Instagram</span><span>TikTok</span><span>Facebook</span><span>X</span><span>Reddit</span><span>Pinterest</span><span>Vimeo</span></div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const API = location.origin;
const ALL_Q = [360, 480, 720, 1080, 1440, 2160];
let type = "video", quality = 720, currentUrl = "";

const msg = (t, err) => { $("msg").textContent = t || ""; $("msg").className = err ? "err" : ""; };
try { $("key").value = localStorage.getItem("vdl_key") || ""; } catch (e) {}
if (!$("key").value) $("keybox").classList.add("open");
$("keyBtn").onclick = () => $("keybox").classList.toggle("open");
$("key").oninput = () => { try { localStorage.setItem("vdl_key", $("key").value.trim()); } catch (e) {} };

const hdr = () => ({ "x-api-key": $("key").value.trim() });
const compact = n => (n == null ? "-" : new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 }).format(n));
function fmtDur(s) {
  if (!s) return "";
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = Math.floor(s % 60);
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(r).padStart(2, "0");
}
function ago(d) {
  if (!d || d.length !== 8) return ["-", "uploaded"];
  const t = new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8));
  const days = Math.max(0, Math.floor((Date.now() - t) / 864e5));
  if (days < 1) return ["Today", "uploaded"];
  if (days < 7) return [days + " d", "ago"];
  if (days < 60) return [Math.floor(days / 7) + " wk", "ago"];
  if (days < 365) return [Math.floor(days / 30) + " mo", "ago"];
  return [Math.floor(days / 365) + " y", "ago"];
}
async function errText(res) {
  try { return (await res.json()).detail || res.statusText; } catch (e) { return res.statusText || "Request failed"; }
}

function renderChips(max) {
  const list = ALL_Q.filter(q => !max || q <= max);
  if (!list.length) list.push(720);
  if (!list.includes(quality)) quality = list.includes(720) ? 720 : list[list.length - 1];
  $("chips").innerHTML = "";
  list.forEach(q => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = q + "p"; b.className = q === quality ? "on" : "";
    b.onclick = () => { quality = q; renderChips(max); setDl(); };
    $("chips").appendChild(b);
  });
}
function setDl() {
  $("dl").innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>' +
    (type === "audio" ? "Download MP3" : "Download MP4, " + quality + "p");
  $("chips").style.display = type === "audio" ? "none" : "flex";
}
function setType(t) {
  type = t;
  $("tVideo").className = t === "video" ? "on" : "";
  $("tAudio").className = t === "audio" ? "on" : "";
  setDl();
}
$("tVideo").onclick = () => setType("video");
$("tAudio").onclick = () => setType("audio");

function show(d) {
  $("title").textContent = d.title || "Untitled";
  $("plat").textContent = d.platform || "";
  $("dur").textContent = fmtDur(d.duration);
  $("dur").style.display = d.duration ? "" : "none";
  const img = $("thumb");
  img.style.display = d.thumbnail ? "" : "none";
  img.onerror = () => { img.style.display = "none"; };
  if (d.thumbnail) img.src = d.thumbnail;
  const name = d.uploader || "Unknown creator";
  $("cname").textContent = name;
  $("csub").textContent = d.follower_count != null ? compact(d.follower_count) + " followers" : (d.platform || "");
  const av = $("avatar");
  av.innerHTML = "";
  if (d.uploader_avatar) {
    const i = document.createElement("img");
    i.src = d.uploader_avatar; i.alt = ""; i.referrerPolicy = "no-referrer";
    i.onerror = () => { av.textContent = name.trim().charAt(0).toUpperCase() || "?"; };
    av.appendChild(i);
  } else { av.textContent = name.trim().charAt(0).toUpperCase() || "?"; }
  $("views").textContent = compact(d.view_count);
  $("likes").textContent = compact(d.like_count);
  const a = ago(d.upload_date); $("ago").textContent = a[0]; $("agoL").textContent = a[1];
  renderChips(Math.max(0, ...(d.available_qualities || [0])));
  setType("video");
  $("result").style.display = "grid";
}

$("form").onsubmit = async e => {
  e.preventDefault();
  if (!$("key").value.trim()) { $("keybox").classList.add("open"); $("key").focus(); msg("Enter your API key first.", true); return; }
  currentUrl = $("link").value.trim();
  $("fetchBtn").disabled = true;
  msg("Reading link... if the server was asleep this can take up to a minute.");
  try {
    const res = await fetch(`${API}/api/info?url=${encodeURIComponent(currentUrl)}`, { headers: hdr() });
    if (!res.ok) throw new Error(await errText(res));
    show(await res.json());
    msg("");
    $("result").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (err) { $("result").style.display = "none"; msg(err.message, true); }
  $("fetchBtn").disabled = false;
};

$("dl").onclick = async () => {
  if (!currentUrl) return;
  const label = $("dl").innerHTML;
  $("dl").disabled = true; $("dl").textContent = "Preparing your file...";
  msg("Downloading and processing. Big videos can take a minute or two.");
  try {
    const res = await fetch(`${API}/api/download?url=${encodeURIComponent(currentUrl)}&quality=${quality}&type=${type}`, { headers: hdr() });
    if (!res.ok) throw new Error(await errText(res));
    const cd = res.headers.get("content-disposition") || "";
    const m = cd.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
    const fname = m ? decodeURIComponent(m[1]) : (type === "audio" ? "audio.mp3" : "video.mp4");
    const blob = await res.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    msg("Saved: " + fname);
  } catch (err) { msg(err.message, true); }
  $("dl").innerHTML = label; $("dl").disabled = false;
};
</script>
</body>
</html>
