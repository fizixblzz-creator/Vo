services:
  - type: web
    name: video-downloader-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://yourdomain.com
      - key: COOKIES_FILE
        value: /etc/secrets/cookies.txt
